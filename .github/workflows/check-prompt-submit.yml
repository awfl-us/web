name: Verify prompt submission behavior
on:
  pull_request:
    paths:
      - 'src/hooks/useWorkflowExec.ts'
      - 'src/features/sessions/components/PromptComposer.tsx'
      - 'src/pages/Sessions.tsx'
      - 'src/features/agents/hooks/useAgentWorkflowExecute.ts'
      - '.github/workflows/check-prompt-submit.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --run
