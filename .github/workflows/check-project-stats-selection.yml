name: Verify reactive project-scoped Stats
on:
  pull_request:
    paths:
      - 'src/features/projects/**'
      - 'src/features/stats/**'
      - 'src/pages/Stats.tsx'
      - '.github/workflows/check-project-stats-selection.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --run
